[supervisord]
nodaemon=true
logfile=./logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=./logs/supervisord.pid
loglevel=info

[program:rag_server]
command=%(ENV_HOME)s/marin_venv/bin/python3 rag_server.py --port 5080
directory=/home/sword/Documents/marin
environment=OLLAMA_BASE_URL="http://127.0.0.1:11434",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=100
startsecs=5
startretries=5
stderr_logfile=./logs/rag.err.log
stdout_logfile=./logs/rag.out.log

[program:moduleflow]
command=%(ENV_HOME)s/marin_venv/bin/python3 moduleflow/serve.py
directory=/home/sword/Documents/marin
environment=OLLAMA_BASE_URL="http://127.0.0.1:11434",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=200
startsecs=3
startretries=5
stderr_logfile=./logs/moduleflow.err.log
stdout_logfile=./logs/moduleflow.out.log

[program:telegram_bot]
command=%(ENV_HOME)s/marin_venv/bin/python3 telegram_bot.py
directory=/home/sword/Documents/marin
environment=OLLAMA_BASE_URL="http://127.0.0.1:11434",PYTHONUNBUFFERED="1"
autostart=true
autorestart=unexpected
exitcodes=0,1
priority=400
startretries=3
stderr_logfile=./logs/telegram.err.log
stdout_logfile=./logs/telegram.out.log

[program:main_app]
command=%(ENV_HOME)s/marin_venv/bin/python3 -m uvicorn main:app --host 0.0.0.0 --port 5069 --log-level info
directory=/home/sword/Documents/marin
environment=OLLAMA_BASE_URL="http://127.0.0.1:11434",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
priority=300
startsecs=15
startretries=5
stderr_logfile=./logs/main.err.log
stdout_logfile=./logs/main.out.log

