<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marin — Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink:        #13100e;
            --ink2:       #1c1814;
            --ink3:       #221e19;
            --surface:    #2a2520;
            --border:     #3a342c;
            --border-hi:  #52473c;
            --teal:       #4db8a4;
            --teal-dim:   #2d8a78;
            --teal-glow:  rgba(77,184,164,.18);
            --teal-soft:  rgba(77,184,164,.08);
            --coral:      #e07b6a;
            --gold:       #c9965a;
            --gold-soft:  rgba(201,150,90,.12);
            --success:    #5db882;
            --danger:     #e07b6a;
            --text:       #e8ddd0;
            --text-dim:   #8a7d72;
            --text-muted: #4a4038;
            --radius:     10px;
            --radius-sm:  6px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--ink);
            color: var(--text);
            min-height: 100vh;
        }

        /* grain overlay */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 900; opacity: .6;
        }

        /* ── NAV ── */
        nav {
            background: var(--ink2);
            border-bottom: 1px solid var(--border);
            padding: 0 28px;
            height: 54px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 200;
        }
        nav::after {
            content: '';
            position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--teal-dim), transparent);
        }
        .nav-brand {
            font-family: 'DM Serif Display', serif;
            font-size: 1.05rem; color: var(--teal);
            display: flex; align-items: center; gap: 10px;
        }
        .nav-brand .hs {
            font-family: 'JetBrains Mono', monospace;
            font-size: .6rem;
            background: linear-gradient(135deg, var(--teal), var(--teal-dim));
            color: #fff; padding: 2px 8px; border-radius: 2px; letter-spacing: .05em;
        }
        .nav-links { display: flex; gap: 6px; align-items: center; }
        .nav-links a {
            color: var(--text-dim); text-decoration: none; font-size: .82rem;
            padding: 6px 12px; border-radius: var(--radius-sm); transition: all .2s;
        }
        .nav-links a:hover { color: var(--text); background: var(--ink3); }
        .nav-links a.active { color: var(--teal); background: var(--teal-soft); }
        .status-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: .65rem; padding: 3px 10px; border-radius: 20px;
            letter-spacing: .06em; text-transform: uppercase;
        }
        .status-online  { background: rgba(77,184,164,.12); color: var(--teal);  border: 1px solid rgba(77,184,164,.3); }
        .status-offline { background: rgba(224,123,106,.08); color: var(--danger); border: 1px solid rgba(224,123,106,.25); }

        main { padding: 24px 30px; }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .panel {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: border-color .2s;
        }
        .panel:hover { border-color: var(--border-hi); }

        .panel-header {
            background: var(--ink3);
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            font-size: .7rem; font-family: 'JetBrains Mono', monospace;
            color: var(--teal); letter-spacing: .1em; text-transform: uppercase;
            display: flex; justify-content: space-between; align-items: center;
        }

        .panel-body {
            padding: 14px;
            font-size: .82rem;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
        }

        .terminal {
            background: var(--ink);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: .75rem;
            color: var(--teal);
            height: 180px;
            overflow-y: auto;
        }

        .terminal-input { display: flex; margin-top: 8px; gap: 6px; }
        .terminal-input input {
            flex: 1; background: var(--ink); border: 1px solid var(--border);
            color: var(--text); padding: 8px 12px;
            font-family: 'JetBrains Mono', monospace; font-size: .78rem;
            border-radius: var(--radius-sm); outline: none;
            transition: border-color .15s;
        }
        .terminal-input input:focus { border-color: var(--teal); }
        .terminal-input button {
            background: var(--teal); color: var(--ink);
            border: none; padding: 8px 16px; cursor: pointer;
            border-radius: var(--radius-sm); font-weight: 500; font-size: .78rem;
            font-family: 'DM Sans', sans-serif;
        }
        .terminal-input button:hover { background: var(--teal-dim); }

        .stat-row {
            display: flex; justify-content: space-between;
            padding: 6px 0; border-bottom: 1px solid var(--border);
        }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: var(--text-muted); font-size: .78rem; }
        .stat-value { color: var(--teal); font-size: .78rem; font-family: 'JetBrains Mono', monospace; }

        .drop-zone {
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            font-size: .82rem;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--teal);
            color: var(--teal);
            background: var(--teal-soft);
        }

        .full-width { grid-column: 1 / -1; }

        .btn {
            padding: 5px 12px; border: 1px solid var(--border);
            background: var(--ink3); color: var(--text-dim);
            cursor: pointer; border-radius: var(--radius-sm);
            font-size: .75rem; font-family: 'DM Sans', sans-serif;
            transition: all 0.15s;
        }
        .btn:hover { border-color: var(--border-hi); color: var(--text); background: var(--surface); }
        .btn-danger { border-color: rgba(224,123,106,.3); color: var(--danger); }
        .btn-danger:hover { background: rgba(224,123,106,.08); }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 8px 12px;
            background: var(--ink);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: var(--radius-sm);
            font-family: 'JetBrains Mono', monospace;
            font-size: .78rem;
            margin-top: 4px;
            outline: none;
            transition: border-color .15s;
        }
        input:focus, textarea:focus { border-color: var(--teal); }
        input::placeholder { color: var(--text-muted); }

        label { color: var(--text-muted); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; }

        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .settings-editor {
            width: 100%; min-height: 200px; resize: vertical;
            font-family: 'JetBrains Mono', monospace; font-size: .75rem;
            color: var(--teal-dim);
        }

        .msg { padding: 6px 10px; border-radius: var(--radius-sm); margin-top: 8px; font-size: .75rem; }
        .msg-ok  { background: rgba(93,184,130,.08);  color: var(--success); border: 1px solid rgba(93,184,130,.2); }
        .msg-err { background: rgba(224,123,106,.08); color: var(--danger);  border: 1px solid rgba(224,123,106,.2); }

        @media (max-width: 700px) {
            .grid { grid-template-columns: 1fr; }
            .full-width { grid-column: 1; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-brand">
            Marin <span class="hs">HS-02</span>
        </div>
        <div class="nav-links">
            <a href="/chat">Chat</a>
            <a href="/">Home</a>
            <a href="/sentinel">Sentinel</a>
            <a href="/command" class="active">Command</a>
            <span id="status-badge" class="status-badge status-offline">offline</span>
        </div>
    </nav>

    <main>
    <main>
    <div class="grid">
        <!-- System -->
        <div class="panel">
            <div class="panel-header">
                <span>System</span>
                <button class="btn" onclick="refreshSystem()">Refresh</button>
            </div>
            <div class="panel-body" id="system-info">Loading...</div>
        </div>

        <!-- Services -->
        <div class="panel">
            <div class="panel-header">
                <span>Services</span>
                <button class="btn" onclick="refreshServices()">Refresh</button>
            </div>
            <div class="panel-body" id="services-info">Loading...</div>
        </div>

        <!-- Terminal -->
        <div class="panel full-width">
            <div class="panel-header">
                <span>Terminal</span>
                <button class="btn btn-danger" onclick="clearTerminal()">Clear</button>
            </div>
            <div class="panel-body">
                <div class="terminal" id="terminal">
                    <div style="color:var(--text-muted)">Marin OS Terminal ready.</div>
                </div>
                <div class="terminal-input">
                    <input type="text" id="cmd-input" placeholder="$ " onkeypress="if(event.key==='Enter')execCmd()">
                    <button onclick="execCmd()">RUN</button>
                </div>
            </div>
        </div>

        <!-- Document Drop -->
        <div class="panel">
            <div class="panel-header">
                <span>DOCUMENTS (Auto-RAG)</span>
            </div>
            <div class="panel-body">
                <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
                    <p>Drop files here</p>
                    <p style="font-size:10px;color:#444">PDF, TXT, MD, DOCX — auto-ingest</p>
                    <input type="file" id="file-input" multiple accept=".pdf,.txt,.md,.docx" style="display:none" onchange="uploadFiles(this.files)">
                </div>
                <div id="doc-list" style="margin-top:8px"></div>
            </div>
        </div>

        <!-- Health -->
        <div class="panel">
            <div class="panel-header">
                <span>Health</span>
                <button class="btn" onclick="refreshHealth()">Refresh</button>
            </div>
            <div class="panel-body" id="health-log">Loading...</div>
        </div>

        <!-- Telegram -->
        <div class="panel">
            <div class="panel-header"><span>Telegram</span></div>
            <div class="panel-body">
                <label>Bot Token</label>
                <input type="password" id="tg-token" placeholder="123456:ABC-DEF...">
                <label style="margin-top:8px;display:block">Chat ID</label>
                <input type="text" id="tg-chat" placeholder="8058658801">
                <button class="btn" onclick="saveTelegram()" style="margin-top:10px">Save Telegram</button>
                <div id="tg-msg"></div>
            </div>
        </div>

        <!-- Email -->
        <div class="panel">
            <div class="panel-header"><span>Email (Gmail)</span></div>
            <div class="panel-body">
                <label>Gmail Address</label>
                <input type="text" id="email-addr" placeholder="you@gmail.com">
                <label style="margin-top:8px;display:block">App Password</label>
                <input type="password" id="email-pass" placeholder="xxxx-xxxx-xxxx-xxxx">
                <button class="btn" onclick="saveEmail()" style="margin-top:10px">Save Email</button>
                <div id="email-msg"></div>
            </div>
        </div>

        <!-- API Keys -->
        <div class="panel">
            <div class="panel-header"><span>API Keys</span></div>
            <div class="panel-body">
                <div class="config-grid">
                    <div>
                        <label>OpenAI</label>
                        <input type="password" id="key-openai" placeholder="sk-...">
                    </div>
                    <div>
                        <label>Gemini</label>
                        <input type="password" id="key-gemini" placeholder="AIza...">
                    </div>
                    <div>
                        <label>Anthropic</label>
                        <input type="password" id="key-anthropic" placeholder="sk-ant-...">
                    </div>
                    <div>
                        <label>Ollama URL</label>
                        <input type="text" id="key-ollama" placeholder="http://localhost:11434">
                    </div>
                </div>
                <button class="btn" onclick="saveKeys()" style="margin-top:10px">Save Keys</button>
                <div id="keys-msg"></div>
            </div>
        </div>

        <!-- Settings.json Editor -->
        <div class="panel full-width">
            <div class="panel-header">
                <span>settings.json</span>
                <div>
                    <button class="btn" onclick="loadSettings()">Load</button>
                    <button class="btn" onclick="saveSettings()">Save</button>
                </div>
            </div>
            <div class="panel-body">
                <textarea class="settings-editor" id="settings-editor" spellcheck="false"></textarea>
                <div id="settings-msg"></div>
            </div>
        </div>
    </div>
    </main>

    <script>
        const API = '';

        async function checkHealth() {
            try {
                const r = await fetch(API + '/health');
                const d = await r.json();
                const b = document.getElementById('status-badge');
                b.className = d.status === 'alive' ? 'status-badge status-online' : 'status-badge status-offline';
                b.textContent = d.status === 'alive' ? 'online' : 'offline';
            } catch(e) {
                document.getElementById('status-badge').className = 'status-badge status-offline';
                document.getElementById('status-badge').textContent = 'OFFLINE';
            }
        }

        async function refreshSystem() {
            try {
                const r = await fetch(API + '/system');
                const d = await r.json();
                document.getElementById('system-info').innerHTML = `
                    <div class="stat-row"><span class="stat-label">Hostname</span><span class="stat-value">${d.hostname}</span></div>
                    <div class="stat-row"><span class="stat-label">Platform</span><span class="stat-value">${d.platform}</span></div>
                    <div class="stat-row"><span class="stat-label">Python</span><span class="stat-value">${d.python}</span></div>
                    <div class="stat-row"><span class="stat-label">Disk</span><span class="stat-value">${d.disk_used_gb}/${d.disk_total_gb} GB</span></div>
                    <div class="stat-row"><span class="stat-label">Memory</span><span class="stat-value">${d.mem_used_pct}%</span></div>
                    <div class="stat-row"><span class="stat-label">Load</span><span class="stat-value">${d.load_1m}</span></div>
                    <div class="stat-row"><span class="stat-label">Uptime</span><span class="stat-value">${d.uptime || 'N/A'}</span></div>
                `;
            } catch(e) {
                document.getElementById('system-info').innerHTML = '<span style="color:#ff4444">Cannot reach API</span>';
            }
        }

        async function refreshServices() {
            try {
                const r = await fetch(API + '/desktop');
                const d = await r.json();
                document.getElementById('services-info').innerHTML = '<pre style="white-space:pre-wrap;font-size:10px">' + d.processes + '</pre>';
            } catch(e) {
                document.getElementById('services-info').innerHTML = '<span style="color:#ff4444">Cannot reach API</span>';
            }
        }

        async function execCmd() {
            const input = document.getElementById('cmd-input');
            const cmd = input.value.trim();
            if (!cmd) return;
            const term = document.getElementById('terminal');
            term.innerHTML += `<div style="color:var(--teal)">$ ${cmd}</div>`;
            input.value = '';
            try {
                const r = await fetch(API + '/execute', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({cmd: cmd, timeout: 30})
                });
                const d = await r.json();
                if (d.stdout) term.innerHTML += `<div style="color:#aaa">${d.stdout}</div>`;
                if (d.stderr) term.innerHTML += `<div style="color:#ff4444">${d.stderr}</div>`;
                if (d.code !== 0 && d.code !== undefined) term.innerHTML += `<div style="color:#ffaa00">exit: ${d.code}</div>`;
            } catch(e) {
                term.innerHTML += `<div style="color:#ff4444">Error: ${e.message}</div>`;
            }
            term.scrollTop = term.scrollHeight;
        }

        function clearTerminal() {
            document.getElementById('terminal').innerHTML = '<div style="color:#666">Terminal cleared</div>';
        }

        async function uploadFiles(files) {
            for (const file of files) {
                const fd = new FormData();
                fd.append('file', file);
                try {
                    await fetch(API + '/upload', {method: 'POST', body: fd});
                    const list = document.getElementById('doc-list');
                    list.innerHTML += `<div style="color:#00ff88;font-size:11px;padding:3px 0">✓ ${file.name}</div>`;
                } catch(e) {
                    const list = document.getElementById('doc-list');
                    list.innerHTML += `<div style="color:#ff4444;font-size:11px;padding:3px 0">✗ ${file.name}</div>`;
                }
            }
        }

        const dz = document.getElementById('drop-zone');
        dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
        dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
        dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); uploadFiles(e.dataTransfer.files); });

        async function refreshHealth() {
            try {
                const r = await fetch(API + '/health');
                const d = await r.json();
                document.getElementById('health-log').innerHTML = `
                    <div class="stat-row"><span class="stat-label">Status</span><span class="stat-value ${d.status==='alive'?'log-ok':'log-err'}">${d.status}</span></div>
                    <div class="stat-row"><span class="stat-label">Who</span><span class="stat-value">${d.who}</span></div>
                `;
            } catch(e) {
                document.getElementById('health-log').innerHTML = '<span style="color:#ff4444">Cannot reach API</span>';
            }
        }

        function showMsg(id, text, ok) {
            const el = document.getElementById(id);
            el.innerHTML = `<div class="msg ${ok?'msg-ok':'msg-err'}">${text}</div>`;
            setTimeout(() => el.innerHTML = '', 3000);
        }

        async function saveTelegram() {
            const token = document.getElementById('tg-token').value;
            const chat = document.getElementById('tg-chat').value;
            if (!token || !chat) return showMsg('tg-msg', 'Fill both fields', false);
            try {
                const r = await fetch(API + '/telegram', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({bot_token: token, chat_id: chat})
                });
                showMsg('tg-msg', 'Telegram saved', true);
            } catch(e) { showMsg('tg-msg', e.message, false); }
        }

        async function saveEmail() {
            const addr = document.getElementById('email-addr').value;
            const pass = document.getElementById('email-pass').value;
            if (!addr || !pass) return showMsg('email-msg', 'Fill both fields', false);
            try {
                const r = await fetch(API + '/email', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({gmail_address: addr, gmail_password: pass})
                });
                showMsg('email-msg', 'Email saved', true);
            } catch(e) { showMsg('email-msg', e.message, false); }
        }

        async function saveKeys() {
            const keys = {
                openai: document.getElementById('key-openai').value,
                gemini: document.getElementById('key-gemini').value,
                anthropic: document.getElementById('key-anthropic').value,
                ollama_url: document.getElementById('key-ollama').value
            };
            try {
                await fetch(API + '/api-keys', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(keys)
                });
                showMsg('keys-msg', 'API keys saved', true);
            } catch(e) { showMsg('keys-msg', e.message, false); }
        }

        async function loadSettings() {
            try {
                const r = await fetch(API + '/settings');
                const d = await r.json();
                document.getElementById('settings-editor').value = JSON.stringify(d, null, 2);
            } catch(e) { showMsg('settings-msg', 'Failed to load', false); }
        }

        async function saveSettings() {
            const content = document.getElementById('settings-editor').value;
            try {
                JSON.parse(content); // validate
                await fetch(API + '/settings', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({content: content})
                });
                showMsg('settings-msg', 'Settings saved', true);
            } catch(e) {
                if (e instanceof SyntaxError) showMsg('settings-msg', 'Invalid JSON', false);
                else showMsg('settings-msg', e.message, false);
            }
        }

        // Load existing configs
        async function loadConfigs() {
            try {
                const [tg, email, keys] = await Promise.all([
                    fetch(API + '/telegram').then(r => r.json()),
                    fetch(API + '/email').then(r => r.json()),
                    fetch(API + '/api-keys').then(r => r.json())
                ]);
                if (tg.bot_token) document.getElementById('tg-token').value = tg.bot_token;
                if (tg.chat_id) document.getElementById('tg-chat').value = tg.chat_id;
                if (email.gmail_address) document.getElementById('email-addr').value = email.gmail_address;
                if (email.gmail_password) document.getElementById('email-pass').value = email.gmail_password;
                if (keys.openai) document.getElementById('key-openai').value = keys.openai;
                if (keys.gemini) document.getElementById('key-gemini').value = keys.gemini;
                if (keys.anthropic) document.getElementById('key-anthropic').value = keys.anthropic;
                if (keys.ollama_url) document.getElementById('key-ollama').value = keys.ollama_url;
            } catch(e) {}
        }

        // Init
        checkHealth();
        refreshSystem();
        refreshServices();
        refreshHealth();
        loadSettings();
        loadConfigs();
        setInterval(checkHealth, 30000);
    </script>
</body>
</html>
