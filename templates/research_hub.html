<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marin — Research Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --ink:        #13100e;
            --ink2:       #1c1814;
            --ink3:       #221e19;
            --surface:    #2a2520;
            --border:     #3a342c;
            --border-hi:  #52473c;
            --teal:       #4db8a4;
            --teal-dim:   #2d8a78;
            --teal-glow:  rgba(77,184,164,.18);
            --teal-soft:  rgba(77,184,164,.08);
            --coral:      #e07b6a;
            --gold:       #c9965a;
            --gold-soft:  rgba(201,150,90,.12);
            --success:    #5db882;
            --danger:     #e07b6a;
            --text:       #e8ddd0;
            --text-dim:   #8a7d72;
            --text-muted: #4a4038;
            --radius:     10px;
            --radius-sm:  6px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--ink);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* grain overlay */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 900; opacity: .6;
        }

        /* ── NAV ── */
        nav {
            background: var(--ink2);
            border-bottom: 1px solid var(--border);
            padding: 0 28px;
            height: 54px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 200;
            flex-shrink: 0;
        }
        nav::after {
            content: '';
            position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--teal-dim), transparent);
        }
        .nav-brand {
            font-family: 'DM Serif Display', serif;
            font-size: 1.05rem; color: var(--teal);
            display: flex; align-items: center; gap: 10px;
        }
        .nav-brand .hs {
            font-family: 'JetBrains Mono', monospace;
            font-size: .6rem;
            background: linear-gradient(135deg, var(--teal), var(--teal-dim));
            color: #fff; padding: 2px 8px; border-radius: 2px; letter-spacing: .05em;
        }
        .nav-links { display: flex; gap: 6px; }
        .nav-links a {
            color: var(--text-dim); text-decoration: none; font-size: .82rem;
            padding: 6px 12px; border-radius: var(--radius-sm);
            transition: all .2s;
        }
        .nav-links a:hover { color: var(--text); background: var(--ink3); }
        .nav-links a.active { color: var(--teal); background: var(--teal-soft); }

        .container {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            overflow-y: auto;
        }

        .search-section {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .search-title {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: var(--teal);
            letter-spacing: .02em;
        }

        .search-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .input-group {
            flex: 1;
            position: relative;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            background: var(--ink);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.9rem;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--teal);
            background: var(--ink2);
        }

        input::placeholder { color: var(--text-muted); }

        .input-group i {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .btn {
            background: var(--teal);
            color: var(--ink);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-sm);
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: .9rem;
            transition: all 0.2s;
        }

        .btn:hover { background: var(--teal-dim); }
        .btn:active { transform: scale(.98); }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
        }
        .btn-ghost:hover { background: var(--ink3); border-color: var(--border-hi); color: var(--text); }
        .btn-ghost.active { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }

        .results-section { margin-top: 2rem; }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .result-card {
            background: var(--ink2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            transition: all 0.25s;
            cursor: pointer;
        }

        .result-card:hover {
            border-color: var(--teal);
            box-shadow: 0 8px 24px var(--teal-glow);
            transform: translateY(-3px);
        }

        .result-icon { font-size: 1.5rem; color: var(--teal); margin-bottom: 0.5rem; }

        .result-title {
            color: var(--text);
            font-weight: 500;
            font-size: .95rem;
            margin-bottom: 0.5rem;
            display: block;
            text-decoration: none;
            transition: color 0.2s;
        }

        .result-card:hover .result-title { color: var(--teal); }

        .result-snippet {
            font-size: 0.82rem;
            color: var(--text-dim);
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .result-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
            display: flex; gap: 1rem; align-items: center;
            font-family: 'JetBrains Mono', monospace;
        }

        .btn-download {
            display: inline-block;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--teal);
            padding: 0.45rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
            margin-top: 0.75rem;
            text-decoration: none;
        }

        .btn-download:hover {
            background: var(--teal-soft);
            border-color: var(--teal);
            color: var(--teal);
        }

        .loader { display: none; text-align: center; padding: 3rem 2rem; }

        .spinner {
            display: inline-block; width: 36px; height: 36px;
            border: 2px solid var(--border);
            border-top-color: var(--teal);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state { text-align: center; padding: 3rem 2rem; color: var(--text-dim); }
        .empty-state i { font-size: 2.5rem; margin-bottom: 1rem; opacity: 0.25; }

        .error-message {
            background: rgba(224,123,106,.08);
            border: 1px solid rgba(224,123,106,.25);
            color: var(--danger);
            padding: 1rem; border-radius: var(--radius-sm); margin-top: 1rem;
        }

        .success-message {
            background: rgba(93,184,130,.08);
            border: 1px solid rgba(93,184,130,.25);
            color: var(--success);
            padding: 1rem; border-radius: var(--radius-sm); margin-top: 1rem;
        }

        @media (max-width: 768px) {
            .search-row { flex-direction: column; }
            .results-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-brand">
            Marin <span class="hs">HS-02</span>
        </div>
        <div class="nav-links">
            <a href="/chat">Chat</a>
            <a href="/">Home</a>
            <a href="/profile">Profile</a>
            <a href="/research" class="active">Research</a>
        </div>
    </nav>

    <div class="container">
        <div class="search-section">
            <div class="search-title">🔍 Search Knowledge Base</div>
            <div class="search-row">
                <div class="input-group">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-query" placeholder="Search topics, books, papers...">
                </div>
                <button class="btn btn-ghost active" id="btn-pdf" onclick="setMode('pdf')" style="padding:0.75rem 1.1rem;">
                    <i class="fas fa-file-pdf"></i> PDF
                </button>
                <button class="btn btn-ghost" id="btn-web" onclick="setMode('web')" style="padding:0.75rem 1.1rem;">
                    <i class="fas fa-globe"></i> Web
                </button>
                <button class="btn" onclick="performSearch()">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
            <div style="font-size:0.75rem; color:var(--dim); margin-top:0.5rem;">
                <i class="fas fa-spider"></i> Powered by Camofox stealth browser
            </div>
        </div>

        <div id="loader" class="loader">
            <div class="spinner"></div>
            <p style="margin-top: 1rem; color: var(--dim);">Searching knowledge base...</p>
        </div>

        <div id="results" class="results-section">
            <div class="empty-state">
                <i class="fas fa-search"></i>
                <p>Enter a search query to find resources</p>
            </div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('search-query');
        let _mode = 'pdf';

        function setMode(m) {
            _mode = m;
            if (m === 'pdf') {
                document.getElementById('btn-pdf').classList.add('active');
                document.getElementById('btn-web').classList.remove('active');
                searchInput.placeholder = 'Search topics, books, papers...';
            } else {
                document.getElementById('btn-web').classList.add('active');
                document.getElementById('btn-pdf').classList.remove('active');
                searchInput.placeholder = 'Search the web via Camofox...';
            }
        }

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        async function browseUrl(url) {
            if (!url) return;
            const loader = document.getElementById('loader');
            const resultsDiv = document.getElementById('results');
            
            loader.style.display = 'block';
            resultsDiv.innerHTML = '';
            
            try {
                const res = await fetch('/api/research/browse', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url})
                });
                const data = await res.json();

                if (data.error) {
                    resultsDiv.innerHTML = `<div class="error-message">Error: ${data.error}</div>`;
                    return;
                }

                resultsDiv.innerHTML = `
                    <div class="result-card" style="width: 100%; cursor: default;">
                        <h4 style="margin-bottom: 10px; color: var(--purple);">${url}</h4>
                        <div style="font-size: 0.9em; margin-top: 10px; white-space: pre-wrap; font-family: monospace; max-height: 70vh; overflow-y: auto;">${data.text}</div>
                    </div>
                `;
            } catch (e) {
                resultsDiv.innerHTML = `<div class="error-message">Connection error: ${e.message}</div>`;
            } finally {
                loader.style.display = 'none';
            }
        }

        async function performSearch() {
            const query = searchInput.value.trim();
            const loader = document.getElementById('loader');
            const resultsDiv = document.getElementById('results');

            if (!query) {
                resultsDiv.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Please enter a search query</div>';
                return;
            }

            if (query.startsWith('http://') || query.startsWith('https://')) {
                return await browseUrl(query);
            }

            loader.style.display = 'block';
            resultsDiv.innerHTML = '';

            try {
                const response = await fetch('/api/research/search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({query: query, mode: _mode})
                });
                
                if (!response.ok) throw new Error('Search failed');
                
                const data = await response.json();
                const icon = _mode === 'pdf' ? 'fa-file-pdf' : 'fa-globe';
                
                if (data.results && data.results.length > 0) {
                    resultsDiv.innerHTML = '<div class="results-grid">' + 
                        data.results.map((r, i) => `
                            <div class="result-card">
                                <div class="result-icon"><i class="fas ${icon}"></i></div>
                                <a href="${r.href || '#'}" target="_blank" class="result-title">${escapeHtml(r.title || 'Untitled')}</a>
                                <div class="result-snippet">${escapeHtml((r.body || 'No description available').substring(0, 150))}...</div>
                                <div class="result-meta">
                                    <span><i class="fas fa-spider"></i> Camofox · Result ${i + 1}</span>
                                </div>
                                <a href="#" onclick="return downloadViaPdfDownloader(event, '${escapeHtml(r.href || '')}')" class="btn-download" title="Download via PDF Downloader">
                                    <i class="fas fa-download"></i> Download PDF
                                </a>
                            </div>
                        `).join('') + 
                        '</div>';
                } else {
                    resultsDiv.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No results found for "<strong>' + escapeHtml(query) + '</strong>"</p></div>';
                }
            } catch (err) {
                resultsDiv.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-triangle"></i> Error: ' + escapeHtml(err.message) + '</div>';
            } finally {
                loader.style.display = 'none';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function downloadViaPdfDownloader(event, url) {
            event.preventDefault();
            if (!url) return false;
            
            const btn = event.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Downloading...';
            btn.style.pointerEvents = 'none';
            
            try {
                const response = await fetch('/api/research/download', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: url})
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    btn.innerHTML = '<i class="fas fa-check"></i> Downloaded!';
                    btn.style.backgroundColor = '#2ecc71';
                    btn.style.color = 'white';
                } else {
                    btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Failed';
                    btn.style.pointerEvents = 'auto';
                }
            } catch (err) {
                btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Error';
                btn.style.pointerEvents = 'auto';
            }
            return false;
        }
    </script>
</body>
</html>
