services:
  marin:
    build: .
    container_name: marin-hs02
    restart: unless-stopped
    # Security hardening: removed unconfined security options
    user: root
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
    # Host mode for direct access to Ollama on localhost
    network_mode: host
    # ports are ignored in host mode but good for documentation
    ports:
      - "5069:5069"
      - "5080:5080"
      - "5070:5070"
    # extra_hosts not needed in host mode
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 2G
          cpus: '0.5'
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://localhost:11434
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - OWNER_USER=Bayazid
      - MARIN_ROLE=owner
      - DOCKER_CONTAINER=1
      - PYTHONUNBUFFERED=1
      - HF_TOKEN=$HF_TOKEN
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    devices:
      - /dev/snd:/dev/snd
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5069"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
